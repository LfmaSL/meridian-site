<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Glow builds during draws, spikes when green finishes (~3.6s), then vanishes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation"
                 values="0;10;18;2"
                 keyTimes="0;0.7;0.93;1"
                 begin="0.5s" dur="3.4s" fill="freeze"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg)"/>

  <g transform="translate(2, -25)" filter="url(#glow)">

    <!-- BLUE PATH — actual path length ≈ 252 -->
    <path d="M 120,380 L 200,240 L 256,310"
          fill="none" stroke="#3B82F6" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="252" stroke-dashoffset="252"
          opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="252" to="0"
               begin="0.5s" dur="1.5s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1"/>
      <animate attributeName="opacity" from="0.3" to="1"
               begin="0.5s" dur="1.5s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1"/>
    </path>

    <!-- GREEN PATH — actual path length ≈ 358; starts after blue finishes -->
    <path d="M 256,310 L 312,180 L 392,380"
          fill="none" stroke="#10B981" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="358" stroke-dashoffset="358"
          opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="358" to="0"
               begin="2.1s" dur="1.5s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1"/>
      <animate attributeName="opacity" from="0.3" to="1"
               begin="2.1s" dur="1.5s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1"/>
    </path>

  </g>

  <!-- Terminal dots (outside glow group to keep them crisp) -->

  <!-- Blue endpoint / junction dot, pops at 2.0s -->
  <g transform="translate(2, -25)">
    <circle cx="256" cy="310" r="0" fill="#3B82F6" opacity="0">
      <animate attributeName="r" values="0;26;20" keyTimes="0;0.6;1"
               calcMode="spline" keySplines="0.34 1.56 0.64 1;0.25 0.1 0.25 1"
               begin="2.0s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.1s" fill="freeze"/>
    </circle>
    <circle cx="256" cy="310" r="0" fill="white" opacity="0">
      <animate attributeName="r" values="0;13;10" keyTimes="0;0.6;1"
               calcMode="spline" keySplines="0.34 1.56 0.64 1;0.25 0.1 0.25 1"
               begin="2.0s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.9" begin="2.0s" dur="0.1s" fill="freeze"/>
    </circle>
  </g>

  <!-- Green endpoint dot, pops at 3.6s -->
  <g transform="translate(2, -25)">
    <circle cx="392" cy="380" r="0" fill="#10B981" opacity="0">
      <animate attributeName="r" values="0;26;20" keyTimes="0;0.6;1"
               calcMode="spline" keySplines="0.34 1.56 0.64 1;0.25 0.1 0.25 1"
               begin="3.6s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.1s" fill="freeze"/>
    </circle>
    <circle cx="392" cy="380" r="0" fill="white" opacity="0">
      <animate attributeName="r" values="0;13;10" keyTimes="0;0.6;1"
               calcMode="spline" keySplines="0.34 1.56 0.64 1;0.25 0.1 0.25 1"
               begin="3.6s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.9" begin="3.6s" dur="0.1s" fill="freeze"/>
    </circle>
  </g>

</svg>
